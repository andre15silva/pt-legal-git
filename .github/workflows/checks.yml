name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -I -m unittest discover -s tools -v
      - name: Copy follows PTS (docs/ESTILO.md)
        run: python -I tools/estilo.py design/screens/*.dc.html design-system/components/bundle.js design-system/components/*/preview.html docs/ESTILO.md
      - name: Design tokens meet contrast targets
        run: python -I tools/check_contrast.py design-system/tokens.json
