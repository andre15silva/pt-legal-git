<html lang="pt-PT">
<head><meta charset="utf-8"><title>StatusPill</title></head>
<body>
<div id="root" class="rd-stage"></div>
<script>
  var R = window.Redacao, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'rd-row'}, ['vigor','futuro','revogado','aditado','pendente','verificado','nao-verificado','inconstitucional'].map(function(s){return h(R.StatusPill, {key:s, status:s});})));
</script>
</body>
